name: Copybara
options:
  bundleIdPrefix: com.copybara
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Copybara:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_NAME: Copybara
        PRODUCT_BUNDLE_IDENTIFIER: com.copybara.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Copybara
        NSLocalNetworkUsageDescription: "Copybara connects with your Mac on the local network to receive clipboard items."
        NSBonjourServices:
          - _copybara._tcp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
